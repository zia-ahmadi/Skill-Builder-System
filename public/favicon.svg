<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" filter="url(#shadow)" />
  <!-- SBS Text -->
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-2">SBS</text>
  <!-- Subtle accent dots -->
  <circle cx="20" cy="30" r="2" fill="white" opacity="0.4" />
  <circle cx="80" cy="30" r="2" fill="white" opacity="0.4" />
  <circle cx="20" cy="75" r="2" fill="white" opacity="0.4" />
  <circle cx="80" cy="75" r="2" fill="white" opacity="0.4" />
</svg>
